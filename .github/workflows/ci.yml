name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only access to the code. The workflow can't change the repo or use any secrets.
permissions:
  contents: read

jobs:
  # The runner image is named, so CI doesn't change under us (the same image as my other projects).
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to exact commits, so a hijacked tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests (the answer key, the published scores, and the README's numbers)
        run: python -m pytest -q

  # Rebuilds the answer key and the results from the 30 pinned repositories, and fails if anything
  # differs from what's committed.
  reproduce:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned dependencies
        run: pip install -r requirements-dev.txt
      - name: Fetch the pinned repositories
        run: python scripts/fetch_repos.py
      - name: Rebuild the answer key and the results
        run: |
          python scripts/build_cases.py
          python scripts/run_baseline.py
          python scripts/run_commands.py
          python scripts/run_sandbox.py  # the sandbox's flags and scores, from its kept runs (the runs need Docker)
      - name: Check that nothing changed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Run tests with the repositories (including the hash of every expected line)
        run: python -m pytest -q
