[project]
name = "docs-proof"
version = "0.1.0"
description = "Find the doc lines a code change made wrong, with proof for each one."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
docs-proof = "docsproof.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.1"]
mcp = ["mcp>=2.3.0,<3"]  # the MCP server; requirements-mcp.txt pins the exact versions tested

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
